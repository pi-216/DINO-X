name: rsna-ich
modality: ct
organs:
  - brain
  - intracranial
source_url: https://www.kaggle.com/c/rsna-intracranial-hemorrhage-detection/data
license: >-
  RSNA Intracranial Hemorrhage Detection Challenge Terms of Use
  (non-commercial research and education only)
license_url: https://www.rsna.org/-/media/files/rsna/education/ai-resources-and-training/ai-image-challenge/rsna_ich_ai_challenge_2019_terms_of_use_and_attribution_final.pdf
redistribution: restricted
redistribution_note: >
  Kaggle hosts the data under "Subject to Competition Rules"; download
  requires entering the competition (rules acceptance in a browser).
  The Terms of Use restrict use to academic research, education and
  other non-commercial purposes, and require attribution (challenge
  dataset link plus the Flanders et al. 2020 citation) on any
  redistribution. Users must download from Kaggle directly.
attribution_required: true
attribution: >
  RSNA Intracranial Hemorrhage Detection Challenge (2019), Kaggle.
  Required citation per the Terms of Use: Flanders AE, Prevedello LM,
  Shih G, et al. Construction of a Machine Learning Dataset through
  Collaboration: The RSNA 2019 Brain CT Hemorrhage Challenge.
  Radiology: Artificial Intelligence 2020;2:3.
total_slices: 41450
total_series: 674
pixel_spacing_range: [0.3, 0.7]
slice_thickness_range: [1.0, 5.0]
hu_range: [-1024, 3071]
annotations:
  - intracranial_hemorrhage
  - intraparenchymal
  - intraventricular
  - subdural
  - extradural
  - subarachnoid
preprocessing:
  format: png_16bit
  encoding: hu16
  index_csv: index.csv
citation: >
  Radiological Society of North America & MD.ai (2019).
  RSNA Intracranial Hemorrhage Detection Challenge. Kaggle.
  https://www.kaggle.com/c/rsna-intracranial-hemorrhage-detection
notes: >
  Massive neuro CT dataset from RSNA 2019 challenge. 674 stage-1 training
  series with ~61 slices/scan average. Six hemorrhage subtypes annotated.
  Critical for cranial anatomy coverage — fills the gap above the neck in
  pan-organ training. DICOM format with standard head CT protocols.
  Variable slice thickness provides excellent ScaleEmbedding anchor points
  for cranial imaging. Stage-1 DICOM ships as one flat directory of
  <study>-<series>-<slice>.dcm files; ingest groups series from DICOM
  header UIDs and decodes HU via RescaleSlope/Intercept before the
  canonical hu16 encoding. Download is gated on Kaggle competition rule
  acceptance (scripts/preprocessing/download_rsna_ich.sh --check).
