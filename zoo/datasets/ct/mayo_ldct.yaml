name: mayo-ldct
modality: ct
organs:
  - chest
  - lung
  - abdomen
  - liver
source_url: https://www.cancerimagingarchive.net/collection/ldct-and-projection-data/
license: CC-BY-4.0
license_url: https://creativecommons.org/licenses/by/4.0/
redistribution: prohibited
redistribution_note: >
  TCIA Data Usage Agreement prohibits redistribution.
  Users must download directly from TCIA after agreeing to the DUA.
attribution_required: true
attribution: >
  Data from The Cancer Imaging Archive (TCIA).
  Cite McCollough et al. and the TCIA DOI: https://doi.org/10.7937/9npb-2637
total_slices: 72588
total_series: 299
pixel_spacing_range: [0.5, 1.0]
slice_thickness_range: [0.5, 5.0]
hu_range: [-1024, 3071]
annotations: []
preprocessing:
  format: png_16bit
  encoding: hu16
  index_csv: index.csv
citation: >
  McCollough CH, et al. Low Dose CT Image and Projection Data.
  The Cancer Imaging Archive (TCIA).
  https://doi.org/10.7937/9npb-2637
notes: >
  Mayo Clinic curated multi-body-part (head, chest, abdomen) low-dose
  CT dataset. ~299 scans explicitly balanced between Siemens and GE
  Healthcare scanners. Includes paired routine-dose and quarter-dose
  reconstructions. Critical for teaching scanner-hardware invariance —
  forces the model to ignore scanner-specific noise profiles and focus
  on pure anatomical morphology. No annotations (self-supervised
  training only). The TCIA collection pairs reconstructed CT with raw
  projection data; only the 299 reconstructed series (CT Image Storage;
  72,588 instances, ~38 GB per the IDC series index) are open access —
  the 99-patient head table requires NIH Controlled Data Access and is
  not fetched by any automated client. The 399 projection series (Raw
  Data Storage, ~8.0M files, ~824 GB) are excluded by SOP Class UID,
  not Modality, because projection series also carry Modality CT.
  Ingest: scripts/preprocessing/download_mayo_ldct.sh fetches the IDC
  open mirror (--check probes reachability); fetch_mayo_ldct.py lists
  and MD5-verifies objects from manifests/mayo_ldct_recon_series.json
  (every series cross-checked against the CC BY 4.0 Chest and Liver
  TCIA tables), and preprocess_mayo_ldct.py writes canonical hu16
  slices plus index.csv and a Parquet manifest.
